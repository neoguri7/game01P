name: Windows Build

on:
  push:
  pull_request:

jobs:
  build-windows:
    name: Build Windows ${{ matrix.configuration }}
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_TARGET_TRIPLET: x64-windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          path: vcpkg
          fetch-depth: 0

      - name: Bootstrap vcpkg
        shell: pwsh
        run: .\vcpkg\bootstrap-vcpkg.bat

      - name: Install vcpkg dependencies
        shell: pwsh
        run: .\vcpkg\vcpkg.exe install --triplet $env:VCPKG_TARGET_TRIPLET

      - name: Build ${{ matrix.configuration }}
        shell: pwsh
        run: .\scripts\check-windows.ps1 -Configuration ${{ matrix.configuration }}

      - name: Stage build artifacts
        shell: pwsh
        run: |
          $artifactDir = "artifacts/windows-${{ matrix.configuration }}"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          Copy-Item -Path "build/windows/${{ matrix.configuration }}/*.exe" -Destination $artifactDir -ErrorAction Stop
          Copy-Item -Path "build/windows/${{ matrix.configuration }}/*.dll" -Destination $artifactDir -ErrorAction SilentlyContinue

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: game01P-windows-${{ matrix.configuration }}
          path: artifacts/windows-${{ matrix.configuration }}/
          if-no-files-found: error
