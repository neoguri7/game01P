name: Windows Build

on:
  push:
  pull_request:

jobs:
  build-windows:
    name: Build Windows Release
    runs-on: windows-latest

    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_TARGET_TRIPLET: x64-windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          path: vcpkg
          fetch-depth: 0

      - name: Bootstrap vcpkg
        shell: pwsh
        run: .\vcpkg\bootstrap-vcpkg.bat

      - name: Install vcpkg dependencies
        shell: pwsh
        run: .\vcpkg\vcpkg.exe install --triplet $env:VCPKG_TARGET_TRIPLET

      - name: Configure CMake
        shell: pwsh
        run: >
          cmake -S . -B build/windows
          -G "Visual Studio 17 2022"
          -A x64
          -DCMAKE_TOOLCHAIN_FILE="${{ env.VCPKG_ROOT }}\scripts\buildsystems\vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=${{ env.VCPKG_TARGET_TRIPLET }}

      - name: Build Release
        shell: pwsh
        run: cmake --build build/windows --config Release --parallel

      - name: Stage build artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/windows-release | Out-Null
          Copy-Item -Path build/windows/Release/*.exe -Destination artifacts/windows-release -ErrorAction Stop
          Copy-Item -Path build/windows/Release/*.dll -Destination artifacts/windows-release -ErrorAction SilentlyContinue

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: game01P-windows-release
          path: artifacts/windows-release/
          if-no-files-found: error
